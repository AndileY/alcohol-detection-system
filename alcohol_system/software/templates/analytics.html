<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlcSecure | Analytics</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f0f2f5;
            color: #1a1a2e;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 260px;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            transition: all 0.3s;
            z-index: 100;
        }

        .sidebar-header {
            padding: 25px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar-header h2 {
            font-size: 1.3rem;
            font-weight: 600;
        }

        .sidebar-header h2 i {
            margin-right: 10px;
            color: #4CAF50;
        }

        .sidebar-header p {
            font-size: 0.75rem;
            color: #888;
            margin-top: 5px;
        }

        .sidebar-menu {
            padding: 20px 0;
        }

        .menu-item {
            padding: 12px 25px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #aaa;
            transition: all 0.3s;
            cursor: pointer;
        }

        .menu-item:hover, .menu-item.active {
            background: rgba(76, 175, 80, 0.1);
            color: white;
            border-left: 3px solid #4CAF50;
        }

        .menu-item i {
            width: 20px;
            font-size: 1.1rem;
        }

        .menu-item a {
            color: inherit;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        /* Main Content */
        .main-content {
            margin-left: 260px;
            padding: 20px 30px;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .page-title h1 {
            font-size: 1.8rem;
            font-weight: 600;
        }

        .page-title p {
            color: #666;
            margin-top: 5px;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .stat-card h3 {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
        }

        .stat-change {
            font-size: 0.75rem;
            margin-top: 5px;
        }

        .positive { color: #4CAF50; }
        .negative { color: #f44336; }

        /* Charts Grid */
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .card-title i {
            margin-right: 8px;
            color: #4CAF50;
        }

        canvas {
            max-height: 300px;
        }

        .full-width {
            grid-column: span 2;
        }

        @media (max-width: 1024px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .charts-grid {
                grid-template-columns: 1fr;
            }
            .full-width {
                grid-column: span 1;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 70px;
            }
            .sidebar-header h2, .sidebar-header p, .menu-item span {
                display: none;
            }
            .main-content {
                margin-left: 70px;
            }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h2><i class="fas fa-flask"></i> AlcSecure</h2>
            <p>Enterprise Alcohol Detection</p>
        </div>
        <div class="sidebar-menu">
            <div class="menu-item">
                <a href="/">
                    <i class="fas fa-tachometer-alt"></i>
                    <span>Dashboard</span>
                </a>
            </div>
            <div class="menu-item active">
                <a href="/analytics">
                    <i class="fas fa-chart-line"></i>
                    <span>Analytics</span>
                </a>
            </div>
            <div class="menu-item">
                <a href="/history">
                    <i class="fas fa-history"></i>
                    <span>History</span>
                </a>
            </div>
            <div class="menu-item">
                <a href="/settings">
                    <i class="fas fa-cog"></i>
                    <span>Settings</span>
                </a>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="top-bar">
            <div class="page-title">
                <h1>Analytics</h1>
                <p>Comprehensive data analysis and insights</p>
            </div>
            <div class="status-badge" style="background: #e8f5e9; padding: 8px 16px; border-radius: 50px;">
                <span>Last 7 Days</span>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Tests</h3>
                <div class="stat-value" id="totalTests">0</div>
            </div>
            <div class="stat-card">
                <h3>Success Rate</h3>
                <div class="stat-value" id="successRate">0%</div>
                <div class="stat-change" id="successTrend"></div>
            </div>
            <div class="stat-card">
                <h3>Avg BAC %</h3>
                <div class="stat-value" id="avgBAC">0%</div>
            </div>
            <div class="stat-card">
                <h3>Peak BAC</h3>
                <div class="stat-value" id="peakBAC">0%</div>
            </div>
        </div>

        <div class="charts-grid">
            <div class="card">
                <div class="card-header">
                    <div class="card-title">
                        <i class="fas fa-chart-bar"></i> Daily Tests (Last 7 Days)
                    </div>
                </div>
                <canvas id="dailyChart"></canvas>
            </div>

            <div class="card">
                <div class="card-header">
                    <div class="card-title">
                        <i class="fas fa-chart-pie"></i> Grant vs Deny Ratio
                    </div>
                </div>
                <canvas id="ratioChart"></canvas>
            </div>

            <div class="card full-width">
                <div class="card-header">
                    <div class="card-title">
                        <i class="fas fa-chart-line"></i> BAC Trend (Last 100 Tests)
                    </div>
                </div>
                <canvas id="trendChart"></canvas>
            </div>

            <div class="card full-width">
                <div class="card-header">
                    <div class="card-title">
                        <i class="fas fa-clock"></i> Hourly Distribution
                    </div>
                </div>
                <canvas id="hourlyChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        const socket = io();

        // Chart instances
        let dailyChart, ratioChart, trendChart, hourlyChart;

        // Initialize charts
        function initCharts() {
            const ctxDaily = document.getElementById('dailyChart').getContext('2d');
            dailyChart = new Chart(ctxDaily, {
                type: 'bar',
                data: { labels: [], datasets: [{ label: 'Tests', data: [], backgroundColor: '#4CAF50' }] },
                options: { responsive: true, maintainAspectRatio: true }
            });

            const ctxRatio = document.getElementById('ratioChart').getContext('2d');
            ratioChart = new Chart(ctxRatio, {
                type: 'doughnut',
                data: { labels: ['Granted', 'Denied'], datasets: [{ data: [0, 0], backgroundColor: ['#4CAF50', '#f44336'] }] },
                options: { responsive: true, maintainAspectRatio: true }
            });

            const ctxTrend = document.getElementById('trendChart').getContext('2d');
            trendChart = new Chart(ctxTrend, {
                type: 'line',
                data: { labels: [], datasets: [{ label: 'BAC %', data: [], borderColor: '#4CAF50', fill: false, tension: 0.4 }] },
                options: { responsive: true, maintainAspectRatio: true }
            });

            const ctxHourly = document.getElementById('hourlyChart').getContext('2d');
            hourlyChart = new Chart(ctxHourly, {
                type: 'line',
                data: { labels: [], datasets: [{ label: 'Tests per Hour', data: [], borderColor: '#2196F3', fill: true }] },
                options: { responsive: true, maintainAspectRatio: true }
            });
        }

        // Update daily chart
        function updateDailyChart(data) {
            dailyChart.data.labels = data.map(d => d.date);
            dailyChart.data.datasets[0].data = data.map(d => d.total);
            dailyChart.update();
        }

        // Update ratio chart
        function updateRatioChart(granted, denied) {
            ratioChart.data.datasets[0].data = [granted, denied];
            ratioChart.update();
        }

        // Update trend chart
        function updateTrendChart(history) {
            trendChart.data.labels = history.timestamps || [];
            trendChart.data.datasets[0].data = history.percentages || [];
            trendChart.update();
        }

        // Update hourly chart
        function updateHourlyChart(data) {
            hourlyChart.data.labels = data.map(d => d.hour);
            hourlyChart.data.datasets[0].data = data.map(d => d.count);
            hourlyChart.update();
        }

        // Update stats
        function updateStats(stats) {
            document.getElementById('totalTests').innerText = stats.total_tests || 0;
            document.getElementById('successRate').innerText = (stats.success_rate || 0) + '%';
            document.getElementById('avgBAC').innerText = (stats.avg_percentage || 0) + '%';
            document.getElementById('peakBAC').innerText = (stats.max_percentage || 0) + '%';
            updateRatioChart(stats.granted_count || 0, stats.denied_count || 0);
        }

        // Socket events
        socket.on('connect', function() {
            console.log('Connected to analytics');
            socket.emit('request_history');
        });

        socket.on('history_update', function(data) {
            updateTrendChart(data);
        });

        socket.on('stats_update', function(data) {
            updateStats(data);
        });

        socket.on('daily_update', function(data) {
            updateDailyChart(data);
            // Also fetch hourly data
            fetch('/api/hourly')
                .then(res => res.json())
                .then(data => updateHourlyChart(data));
        });

        // Initial load
        initCharts();
        
        fetch('/api/stats').then(res => res.json()).then(data => updateStats(data));
        fetch('/api/daily').then(res => res.json()).then(data => updateDailyChart(data));
        fetch('/api/hourly').then(res => res.json()).then(data => updateHourlyChart(data));
        fetch('/api/history').then(res => res.json()).then(data => updateTrendChart(data));
    </script>
</body>
</html>
